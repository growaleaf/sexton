<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sexton — a game of change ringing</title>
<meta name="description" content="You ring the treble. Learn real English change-ringing — Plain Hunt, then Plain Bob Doubles — and ring the village's procedural years.">
<meta property="og:title" content="Sexton">
<meta property="og:description" content="Real English change-ringing as a game. Ring the treble, learn the method, call the village's years.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1712'/%3E%3Cpath d='M16 6c-1 0-1.8.8-1.8 1.8v.7c-3.6.9-6.2 4-6.2 8.3v3.4l-2 3.3h20l-2-3.3v-3.4c0-4.3-2.6-7.4-6.2-8.3v-.7C17.8 6.8 17 6 16 6z' fill='%23e8b34a'/%3E%3Cellipse cx='16' cy='24.5' rx='3.4' ry='1.6' fill='%23c98f2e'/%3E%3Ccircle cx='16' cy='27' r='1.3' fill='%23e8b34a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#171310; --bg2:#231d17; --stone:#3a332b; --stone2:#4a4136;
    --parchment:#ece4d3; --dim:#b8ab93; --gold:#e8b34a; --gold-dim:#a97c2c;
    --good:#7fae6a; --bad:#c46a5a; --line:#4a4136;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--parchment);}
  body{
    font-family:Georgia,'Times New Roman',serif;
    min-height:100dvh;
    display:flex; justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2f1e 0%, transparent 55%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 60%);
  }
  #app{
    width:100%; max-width:480px; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 16px);
  }
  h1,h2,h3{margin:0 0 8px; font-weight:normal; letter-spacing:.02em;}
  h1{font-size:2.1rem; color:var(--gold);}
  h2{font-size:1.3rem; color:var(--parchment);}
  p{line-height:1.5; color:var(--dim); margin:0 0 12px;}
  .voice{color:var(--parchment); font-style:italic;}
  .screen{display:flex; flex-direction:column; flex:1; gap:14px; animation:fade .3s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-size:1rem; color:var(--parchment);
    background:var(--stone); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; cursor:pointer; text-align:left;
  }
  button:active{background:var(--stone2);}
  button.primary{background:linear-gradient(180deg,#caa04a,var(--gold-dim)); color:#211a0f; border:none; font-weight:bold; text-align:center;}
  button.ghost{background:transparent;}
  button.wide{width:100%;}
  button:disabled{opacity:.4; cursor:default;}
  .actionrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .actionrow button{text-align:center; padding:18px 6px; font-size:1.05rem;}
  .rowdisplay{
    display:flex; justify-content:center; gap:6px; padding:18px 8px;
    background:var(--bg2); border:1px solid var(--line); border-radius:12px;
  }
  .bell{
    width:38px; height:44px; border-radius:8px 8px 14px 14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--stone); color:var(--dim); font-size:1.1rem; font-weight:bold;
    border:1px solid var(--line); transition:transform .2s;
  }
  .bell.you{background:linear-gradient(180deg,#caa04a,var(--gold-dim)); color:#211a0f; box-shadow:0 0 12px #e8b34a55;}
  .bell.rung{transform:translateY(-4px);}
  .hint{font-size:.85rem; color:var(--dim);}
  .msg{min-height:1.4em; font-size:.95rem;}
  .msg.good{color:var(--good);}
  .msg.bad{color:var(--bad);}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .topbar button{padding:8px 10px; font-size:.85rem;}
  .card{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .yearlist{display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
  .yearcard{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .yearcard .meta{flex:1;}
  .yearcard .year{color:var(--gold); font-size:1.1rem;}
  .yearcard .done{color:var(--good); font-size:1.3rem;}
  .badge{display:inline-block; font-size:.75rem; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:2px 6px; margin-left:6px;}
  .center{text-align:center;}
  .callbanner{
    text-align:center; font-size:1.4rem; letter-spacing:.06em; color:var(--gold);
    padding:8px; border:1px dashed var(--gold-dim); border-radius:10px; text-transform:uppercase;
  }
  footer{margin-top:auto; padding-top:10px; text-align:center; font-size:.75rem; color:#7a6f5c;}
  a{color:var(--gold);}
</style>
</head>
<body>
<div id="app" role="application" aria-label="Sexton"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
